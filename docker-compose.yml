services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thesis-db
    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: thesis
    ports:
      - "5433:5432"   # 로컬 5432 충돌 방지
    volumes:
      - thesis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thesis_pgdata:
